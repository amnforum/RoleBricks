<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="data:,">
  <title>{% block title %}EmotionOS{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css?v=living-scenes-1">
  {% block styles %}{% endblock %}
</head>
<body data-page="{% block page_id %}base{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/" aria-label="EmotionOS living scenes">
      <span class="brand-mark" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </span>
      <span class="brand-copy">
        <strong>EmotionOS</strong>
        <small>Living character engine</small>
      </span>
    </a>
    <div class="header-meta">
      <span class="engine-state" id="providerStatus">
        <i class="status-dot"></i>
        <span>Checking engine</span>
      </span>
    </div>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/js/app.js?v=living-scenes-1"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
